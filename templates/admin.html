<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Management Panel</h2>
        <a href="/" class="btn btn-secondary btn-sm">Go to Home</a>
    </div>

    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Registered Users List</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user[0] }}</td>
                            <td>{{ user[2] }}</td>
                            <td>{{ user[3] }}</td>
                            <td>{{ user[1] }}</td>
                            <td class="text-center">
                                <!-- Edit Button (Triggers Modal) -->
                                <button class="btn btn-warning btn-sm me-2" 
                                        data-bs-toggle="modal" 
                                        data-bs-target="#editModal{{ user[0] }}">
                                    Edit / Update
                                </button>
                                
                                <!-- Delete Button -->
                                <a href="/admin/delete/{{ user[0] }}" 
                                   class="btn btn-danger btn-sm" 
                                   onclick="return confirm('Kya aap sach me is user ko delete karna chahte hain?');">
                                    Delete
                                </a>
                            </td>
                        </tr>

                        <!-- EDIT MODAL FOR EACH USER -->
                        <div class="modal fade" id="editModal{{ user[0] }}" tabindex="-1" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <form action="/admin/update/{{ user[0] }}" method="POST">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Update User Details (ID: {{ user[0] }})</h5>
                                            <button type="button" class="btn-close" data-bs-shadow="none" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <div class="mb-3">
                                                <label class="form-label">First Name</label>
                                                <input type="text" name="first_name" class="form-content form-control" value="{{ user[2] }}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Last Name</label>
                                                <input type="text" name="last_name" class="form-control" value="{{ user[3] }}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email Address</label>
                                                <input type="email" name="email" class="form-control" value="{{ user[1] }}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">New Password (Leave blank to keep old)</label>
                                                <input type="password" name="password" class="form-control" placeholder="Enter new password">
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <button type="submit" class="btn btn-primary">Save Changes</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
